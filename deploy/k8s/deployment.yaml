apiVersion: apps/v1
kind: Deployment
metadata:
  name: press-farm-os
  labels:
    app: press-farm-os
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below capacity during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app: press-farm-os
  template:
    metadata:
      labels:
        app: press-farm-os
    spec:
      containers:
        - name: web
          # Pin a real tag at deploy time — never :latest.
          image: ghcr.io/michealbreedlove/press-farm-os:REPLACE_TAG
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: press-farm-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: press-farm-os
spec:
  selector:
    app: press-farm-os
  ports:
    - port: 80
      targetPort: 3000
