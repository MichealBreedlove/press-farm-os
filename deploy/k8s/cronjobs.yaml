# Self-host equivalent of vercel.json crons. Each job curls the same
# endpoint Vercel Cron would hit, authenticated with CRON_SECRET (the
# cron/report routes verify `Authorization: Bearer $CRON_SECRET`).
#
# Schedules mirror vercel.json exactly (UTC). If you edit one, edit both.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pf-weekly-digest
spec:
  schedule: "0 9 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              envFrom:
                - secretRef:
                    name: press-farm-env
              command: ["/bin/sh", "-c"]
              args:
                - >
                  curl -fsS --max-time 120
                  -H "Authorization: Bearer $CRON_SECRET"
                  "http://press-farm-os$CRON_PATH"
              env:
                - name: CRON_PATH
                  value: /api/reports/weekly-digest
