apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: press-farm-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: press-farm-os
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Order-submission traffic is bursty (night before Thu/Sat/Mon
      # deliveries) — don't thrash back down between bursts.
      stabilizationWindowSeconds: 300
